services:
  postgres:
    image: postgres:16-alpine
    container_name: nandi-postgres
    environment:
      POSTGRES_USER: nandi
      POSTGRES_PASSWORD: nandi
      POSTGRES_DB: nandi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nandi -d nandi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nandi-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: nandi-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nandi
      DB_PASSWORD: nandi
      DB_NAME: nandi
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-me-in-production
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PROVIDER_PRIMARY_SMS: stub
      PROVIDER_FAILOVER_SMS: stub
      PROVIDER_PRIMARY_WHATSAPP: stub
      PROVIDER_FAILOVER_WHATSAPP: stub
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
