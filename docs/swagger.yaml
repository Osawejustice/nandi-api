  /api/v1/settings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get tenant settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      parameters:
      - description: Settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update tenant settings
      tags:
      - settings
  /api/v1/users:
    post:
      consumes:
      - application/json
      parameters:
      - description: User
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              $ref: '#/definitions/handlers.UserDTO'
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - users
  /api/v1/webhooks/{tenant_slug}/sms/africastalking:
    post:
      consumes:
      - multipart/form-data
      - application/x-www-form-urlencoded
      parameters:
      - description: Tenant slug
        in: path
        name: tenant_slug
        required: true
        type: string
      - description: Sender
        in: formData
        name: from
        required: true
        type: string
      - description: Body
        in: formData
        name: text
        required: true
        type: string
      - description: Provider message id
        in: formData
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
