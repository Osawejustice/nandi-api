        in: path
        name: id
        required: true
        type: string
      - description: Message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ReplyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
