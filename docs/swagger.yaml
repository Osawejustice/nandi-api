      - conversations
    patch:
      consumes:
      - application/json
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      - description: Patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PatchConversationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/handlers.ConversationDTO'
            type: object
      security:
      - BearerAuth: []
      summary: Update conversation
      tags:
      - conversations
  /api/v1/conversations/{id}/messages:
    post:
